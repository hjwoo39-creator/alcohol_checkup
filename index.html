<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>음주운전 예방 자가진단 체크리스트</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="student.css">
  <!-- Chart.js 라이브러리 연동 -->
  <script src="chart.js"></script>
</head>
<body>
  <div class="wrapper">
    
    <!-- 1. 시작 화면 -->
    <div id="start-screen" class="card start-card">
      <div class="logo-area">
        <img src="/도로교통공단 메인 CI.png" class="brand-logo" alt="도로교통공단 로고">
      </div>
      <h1 class="start-title">음주운전 자가진단 체크리스트</h1>
      <p class="start-desc">
        본 평가는 개개인의 음주운전 성향 및 심리적 요인을 과학적으로 측정하여 자가진단하기 위한 공공 교육용 체크리스트입니다. 솔직하고 신속하게 응답해 주시기 바랍니다.
      </p>
      
      <div class="info-grid">
        <div class="info-item">
          <div class="info-label">평가 문항 수</div>
          <div class="info-value">총 49문항</div>
        </div>
        <div class="info-item">
          <div class="info-label">예상 소요시간</div>
          <div class="info-value">약 5 ~ 7분</div>
        </div>
      </div>
      
      <button type="button" id="startBtn" class="btn btn-primary" style="width: 100%;">
        자가진단 시작하기
      </button>
    </div>

    <!-- 2. 자가진단 진행 화면 -->
    <div id="survey-screen" style="display: none;">
      <div class="progress-container">
        <div class="progress-header">
          <span>진행 상황</span>
          <span class="progress-page-num">
            문항 응답: <span id="answeredCount">0</span> / <span id="totalQuestions">49</span>
          </span>
        </div>
        <div class="progress-bar-bg">
          <div id="progressBarFill" class="progress-bar-fill"></div>
        </div>
      </div>

      <form id="checklistForm">
        <div id="questions"></div>
        
        <div class="warning-box" id="warning" style="display: none;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span>현재 페이지의 모든 문항에 응답해야 다음으로 이동할 수 있습니다.</span>
        </div>

        <div class="btn-group">
          <button type="button" id="prevBtn" class="btn btn-outline" disabled>이전 단계</button>
          <button type="button" id="nextBtn" class="btn btn-primary">다음 단계</button>
        </div>
      </form>
    </div>

    <!-- 3. 결과 화면 -->
    <div id="result-screen" style="display: none;">
      <div class="result-header">
        <img src="/도로교통공단 메인 CI.png" class="brand-logo result-logo" alt="도로교통공단 로고">
        <h1>자가진단 결과 리포트</h1>
        <p class="result-subtitle">귀하의 답변 분석에 기반한 음주운전 성향 및 위험요인 요약입니다.</p>
      </div>

      <!-- 유형 결과 카드 -->
      <div class="type-result-card">
        <h2>나의 음주운전 위험 유형</h2>
        <div class="type-name" id="resultType">-</div>
      </div>



      <!-- 상세 요인 리스트 -->
      <div class="card">
        <div class="section-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          평가 영역별 상세 점수
        </div>
        <div class="factor-list" id="factorList"></div>
      </div>

      <!-- 유형 설명 및 가이드 테이블 -->
      <div class="card table-card">
        <div class="section-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
            <line x1="3" y1="9" x2="21" y2="9"></line>
          </svg>
          유형 특징
        </div>
        <div class="table-responsive">
          <table class="summary-table">
            <tr>
              <th>유형 특징</th>
              <td id="typeDetailFeatures">-</td>
            </tr>
          </table>
        </div>
      </div>

      <!-- 리포트 출력 버튼 -->
      <div class="pdf-btn-wrap">
        <button type="button" id="pdfBtn" class="btn btn-primary" style="width: 100%; height: 52px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 8px;">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          리포트 인쇄 및 PDF 저장
        </button>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
